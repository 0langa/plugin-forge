[project]
name = "plugin-forge"
version = "0.1.0"
description = "Multi-provider (Claude Code / Codex / Kimi Code) plugin lifecycle automation: MCP + hooks keep plugin manifests, installs, versions, and marketplace state coherent while you edit source."
authors = [{ name = "0langa" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "watchfiles>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
forge = "plugin_forge.cli:main"
forge-mcp = "plugin_forge.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_forge"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
]
