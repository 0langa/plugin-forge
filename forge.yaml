name: plugin-forge
version: 0.2.17
description: 'Dormant: Generate plugin manifests and coordinate releases across coding
  agents.'
providers:
- claude
- codex
- kimi
surfaces:
  skills:
  - name: using-forge
    path: skills/using-forge/SKILL.md
  - name: release-plugin
    path: skills/release-plugin/SKILL.md
  - name: import-existing
    path: skills/import-existing/SKILL.md
  commands:
  - name: forge
    path: commands/forge.md
  agents: []
  hooks:
  - event: SessionStart
    script: src/plugin_forge/hooks/session_start.py
    matchers: {}
    args: {}
  - event: PostToolUse
    script: src/plugin_forge/hooks/post_tool_use.py
    matchers: {}
    args: {}
  - event: UserPromptSubmit
    script: src/plugin_forge/hooks/user_prompt_submit.py
    matchers: {}
    args: {}
  mcp:
  - name: plugin-forge
    transport: stdio
    package: module:plugin_forge.mcp_server
    env: []
    args: []
install:
  claude: ~/.claude/plugins/plugin-forge/
  codex: ~/.codex/plugins/plugin-forge/
  kimi: ~/.kimi-code/plugins/managed/plugin-forge/
settings_patches: {}
marketplace:
  claude_manifest: ../0langas-plugin-marketplace/plugins.json
  kimi_manifest: ../0langas-plugin-marketplace/kimi-marketplace.json
metadata:
  author: 0langa
  license: MIT
  homepage: https://github.com/0langa/plugin-forge
  repository: https://github.com/0langa/plugin-forge
  keywords:
  - plugin
  - lifecycle
  - claude-code
  - codex
  - kimi-code
  - automation
  interface:
    display_name: Plugin Forge
    short_description: 'Dormant: Generate plugin manifests and coordinate releases
      across coding agents.'
    long_description: 'Dormant: Generate plugin manifests and coordinate releases
      across coding agents. Available as-is, with no planned updates. Kimi compatibility
      is legacy.'
    developer_name: 0langa
    category: Developer Tools
    capabilities:
    - Read
    - Write
    - Planning
    brand_color: '#F05A3A'
    composer_icon: ./assets/icon.png
    logo: ./assets/logo.png
    screenshots:
    - ./assets/screenshot-1.png
  session_start_skill: using-forge
  skill_instructions: In a plugin repo, prefer forge MCP tools over hand-editing manifests.
    Silent success is the default; do not narrate forge internals to the user.
provider_extras:
  claude: {}
  codex: {}
  kimi: {}
options:
  shared_mcp_file: false
